# Ayush Render Blueprint
# Deploys: FastAPI Web Service (backend) + Static Site (frontend)
# Free tier compatible

services:
  # Backend API Service
  - type: web
    name: ayush-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      # CORS - add your frontend URL after first deploy
      - key: CORS_ORIGINS
        value: "https://ayush-frontend.onrender.com"
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: ayush-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: "https://ayush-api.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

# Database (MongoDB) - Use external MongoDB Atlas (free tier)
# Add MONGODB_URI to backend env vars pointing to your Atlas cluster
# Example: mongodb+srv://user:pass@cluster.mongodb.net/ayush